<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IT Group Capacity Planner</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏢 Group IT Capacity Management</a>
            <div class="navbar-nav">
                <a class="nav-link text-white ms-3" href="{{ url_for('portfolio_summary') }}">📊 Portfolio Summary</a>
                <a class="nav-link text-white ms-3" href="{{ url_for('manage_allocations') }}">⚙️ Manage Allocations</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    <script src="https://jsdelivr.net"></script>
</body>
</html>
